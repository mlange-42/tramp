name: Release

on:
  release:
    types: [ created ]

env:
  # Headers required by Gio on Linux, see https://gioui.org/doc/install/linux
  GIO_DEPS: gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev

jobs:
  build-linux:
    name: Linux build
    runs-on: ubuntu-latest
    steps:
      - name: Get tag
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
        shell: bash
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Gio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $GIO_DEPS
      - name: Build
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" .
          chmod +x tramp
      - name: Compress binaries
        run: |
          tar -czf tramp.tar.gz tramp
        shell: bash
      - name: Upload binaries
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: tramp.tar.gz
          asset_name: tramp-${{ env.RELEASE_VERSION }}-linux-amd64.tar.gz
          tag: ${{ github.ref }}

  build-windows:
    name: Windows build
    runs-on: ubuntu-latest
    steps:
      - name: Get tag
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
        shell: bash
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        # Gio needs no cgo on Windows, so cross-compiling works.
        # windowsgui suppresses the console window.
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H windowsgui" .
      - name: Compress binaries
        run: |
          zip -r tramp.zip tramp.exe
        shell: bash
      - name: Upload binaries
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: tramp.zip
          asset_name: tramp-${{ env.RELEASE_VERSION }}-windows-amd64.zip
          tag: ${{ github.ref }}

  build-macos:
    name: MacOS ${{ matrix.arch }} build
    strategy:
      matrix:
        arch: [arm64, amd64]
    runs-on: macos-latest
    steps:
      - name: Get tag
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
        shell: bash
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        # Gio needs cgo on macOS. Go disables cgo when cross-compiling, so enable it explicitly.
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=${{ matrix.arch }} go build -ldflags="-s -w" .
          chmod +x tramp
      - name: Compress binaries
        run: |
          zip -r tramp.zip tramp
        shell: bash
      - name: Upload binaries
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: tramp.zip
          asset_name: tramp-${{ env.RELEASE_VERSION }}-macos-${{ matrix.arch }}.zip
          tag: ${{ github.ref }}
